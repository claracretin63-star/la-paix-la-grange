<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <title>La Paix La Grange – Galerie</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260422">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <a href="index.html" aria-label="Accueil La Paix La Grange">
          <img src="assets/img/Logo de La Paix La Grange.png" alt="Logo La Paix La Grange" class="site-logo" width="220" height="48">
        </a>
      </div>
      <nav class="main-nav">
        <a href="la-maison.html">La maison</a>
        <a href="carte.html">Carte</a>
        <a href="vins.html">Vins</a>
        <a href="galerie.html" class="active">Galerie</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-hero">
      <div class="container">
        <h1>Galerie</h1>
        <p>Quelques ambiances de la maison, de la salle et des assiettes.</p>
      </div>
    </section>

    <section class="container page-content">
      <div class="gallery-grid">
        <figure class="gallery-item">
          <img src="assets/img/gallery/photo-04.png" alt="Façade du Café Restaurant de la Paix et La Grange, chalets en bois et montagne" width="1200" height="900" loading="lazy">
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery/photo-01.png" alt="Fondue au fromage servie dans un pain, fils de fromage" width="1200" height="900" loading="lazy">
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery/photo-02.png" alt="Terrasse avec vue sur les montagnes et cocktail" width="1200" height="900" loading="lazy">
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery/photo-03.png" alt="Village alpin enneigé et sommets sous un ciel bleu" width="1200" height="900" loading="lazy">
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery/photo-05.png" alt="Vue panoramique sur le village et les sommets enneigés" width="1200" height="900" loading="lazy">
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> La Paix La Grange – Tous droits réservés.</p>
    </div>
  </footer>

  <script>
    const yearSpan = document.getElementById('year');
    if (yearSpan) {
      yearSpan.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
