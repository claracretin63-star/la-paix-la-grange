  <div class="lightbox" id="gallery-lightbox" hidden role="dialog" aria-modal="true" aria-hidden="true" data-i18n-aria="galerie.lightboxTitle">

    <div class="lightbox-inner">
      <button type="button" class="lightbox-close" data-lightbox-close data-i18n-aria="galerie.closeLightbox" aria-label="Fermer">×</button>
      <img class="lightbox-img" src="" alt="">

  <script defer src="assets/js/i18n.js?v=202604079"></script>
  <script>
    (function () {
      var lightbox = document.getElementById('gallery-lightbox');
      if (!lightbox) return;
      var lightboxImg = lightbox.querySelector('.lightbox-img');
      var closeTargets = lightbox.querySelectorAll('[data-lightbox-close]');
      var thumbs = document.querySelectorAll('.gallery-thumb');
      var lastFocus = null;

      function openLightbox(src, alt) {
        lastFocus = document.activeElement;
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.hidden = false;
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        var closeBtn = lightbox.querySelector('.lightbox-close');
        if (closeBtn) closeBtn.focus();
      }

      function closeLightbox() {
        lightbox.hidden = true;
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImg.removeAttribute('src');
        lightboxImg.alt = '';
        document.body.style.overflow = '';
        if (lastFocus && typeof lastFocus.focus === 'function') {
          lastFocus.focus();
        }
        lastFocus = null;
      }

      thumbs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var img = btn.querySelector('img');
          if (!img) return;
          openLightbox(img.getAttribute('src') || img.src, img.getAttribute('alt') || '');
        });
      });

      closeTargets.forEach(function (el) {
        el.addEventListener('click', function () {
          closeLightbox();
        });
      });

      document.addEventListener('keydown', function (e) {
        if (lightbox.hidden || e.key !== 'Escape') return;
        closeLightbox();
      });
    })();
  </script>
