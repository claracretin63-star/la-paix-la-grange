<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Paix La Grange – Galerie</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <a href="index.html" aria-label="Accueil La Paix La Grange">
          <img src="assets/img/Logo de La Paix La Grange.png" alt="Logo La Paix La Grange" class="site-logo" width="220" height="48">
        </a>
      </div>
      <nav class="main-nav">
        <a href="la-maison.html">La maison</a>
        <a href="carte.html">Carte</a>
        <a href="vins.html">Vins</a>
        <a href="galerie.html" class="active">Galerie</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-hero">
      <div class="container">
        <h1>Galerie</h1>
        <p>Quelques ambiances de la maison, de la salle et des assiettes.</p>
      </div>
    </section>

    <section class="container page-content">
      <div class="gallery-grid">
        <div class="gallery-item placeholder">
          <span>Photo 1</span>
        </div>
        <div class="gallery-item placeholder">
          <span>Photo 2</span>
        </div>
        <div class="gallery-item placeholder">
          <span>Photo 3</span>
        </div>
        <div class="gallery-item placeholder">
          <span>Photo 4</span>
        </div>
        <div class="gallery-item placeholder">
          <span>Photo 5</span>
        </div>
        <div class="gallery-item placeholder">
          <span>Photo 6</span>
        </div>
      </div>
      <p class="gallery-note">
        Remplacez ces emplacements par vos propres photos (format horizontal recommandé).
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> La Paix La Grange – Tous droits réservés.</p>
    </div>
  </footer>

  <script>
    const yearSpan = document.getElementById('year');
    if (yearSpan) {
      yearSpan.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
